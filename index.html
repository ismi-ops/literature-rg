<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ru's Reading List · Cell Science</title>
<style>
  :root {
    --bg: #f8f9fb; --surface: #ffffff; --border: #e2e5ea;
    --text: #1a1d23; --muted: #6b7280; --accent: #2563eb;
    --accent-light: #eff6ff; --tag-bg: #f0f4ff; --tag-text: #3b4fc0;
    --chip-active-bg: #2563eb; --chip-active-text: #ffffff;
    --shadow: 0 1px 3px rgba(0,0,0,.08); --shadow-hover: 0 4px 12px rgba(0,0,0,.12);
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1117; --surface: #1c1f27; --border: #2a2e38;
      --text: #e8eaf0; --muted: #9ca3af; --accent: #60a5fa;
      --accent-light: #1e2a3d; --tag-bg: #1e2a3d; --tag-text: #93b4f8;
      --shadow: 0 1px 3px rgba(0,0,0,.3); --shadow-hover: 0 4px 12px rgba(0,0,0,.4);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; line-height: 1.55; }

  /* ── Password overlay ─────────────────────────────────────────────────── */
  #pw-overlay {
    position: fixed; inset: 0; z-index: 9999;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
  }
  #pw-box {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 40px 36px; width: 340px; max-width: 90vw;
    box-shadow: 0 8px 32px rgba(0,0,0,.12);
    display: flex; flex-direction: column; gap: 18px; text-align: center;
  }
  #pw-box h2 { font-size: 1.1rem; font-weight: 700; }
  #pw-box p  { font-size: 13px; color: var(--muted); }
  #pw-input {
    width: 100%; padding: 10px 14px; border: 1px solid var(--border);
    border-radius: 8px; background: var(--bg); color: var(--text);
    font-size: 15px; outline: none; text-align: center; letter-spacing: .05em;
  }
  #pw-input:focus { border-color: var(--accent); }
  #pw-btn {
    width: 100%; padding: 10px; border-radius: 8px; border: none;
    background: var(--accent); color: #fff; font-size: 14px; font-weight: 600;
    cursor: pointer; transition: opacity .12s;
  }
  #pw-btn:hover { opacity: .88; }
  #pw-error { font-size: 13px; color: #dc2626; min-height: 18px; }

  /* ── Header & filters ─────────────────────────────────────────────────── */
  header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 18px 24px; position: sticky; top: 0; z-index: 100; }
  .header-inner { max-width: 1100px; margin: auto; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .header-title { font-size: 1.15rem; font-weight: 700; color: var(--text); white-space: nowrap; }
  .header-title span { color: var(--accent); }
  #search { flex: 1; min-width: 180px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font-size: 14px; outline: none; }
  #search:focus { border-color: var(--accent); }
  #result-count { white-space: nowrap; font-size: 13px; color: var(--muted); }
  .filters { background: var(--surface); border-bottom: 1px solid var(--border); padding: 10px 24px; position: sticky; top: 61px; z-index: 99; }
  .filters-inner { max-width: 1100px; margin: auto; display: flex; flex-direction: column; gap: 8px; }
  .filter-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .filter-label { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; min-width: 52px; }
  .chip { display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 20px; border: 1px solid var(--border); background: var(--bg); color: var(--muted); font-size: 12.5px; cursor: pointer; user-select: none; transition: background .12s, color .12s, border-color .12s; white-space: nowrap; }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .chip.active { background: var(--chip-active-bg); color: var(--chip-active-text); border-color: var(--chip-active-bg); }
  .chip .count { margin-left: 5px; opacity: .75; font-size: 11px; }

  /* ── Cards ────────────────────────────────────────────────────────────── */
  main { max-width: 1100px; margin: 24px auto; padding: 0 24px 48px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px; transition: box-shadow .15s; }
  .card:hover { box-shadow: var(--shadow-hover); }
  .card-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 12px; text-transform: capitalize; }
  .badge-research { background: #e0f2fe; color: #0369a1; }
  .badge-review { background: #fce7f3; color: #9d174d; }
  .badge-perspective { background: #f0fdf4; color: #166534; }
  @media (prefers-color-scheme: dark) {
    .badge-research { background: #0c2a3d; color: #7dd3fc; }
    .badge-review { background: #3b0a20; color: #f9a8d4; }
    .badge-perspective { background: #052e16; color: #86efac; }
  }
  .card-date { font-size: 11.5px; color: var(--muted); margin-left: auto; }
  .card-title { font-size: 15px; font-weight: 650; line-height: 1.4; }
  .card-title a { color: var(--text); text-decoration: none; }
  .card-title a:hover { color: var(--accent); text-decoration: underline; }
  .card-authors { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 6px; }
  .author-link { color: var(--muted); text-decoration: none; }
  .author-link:hover { color: var(--accent); text-decoration: underline; }
  .card-venue { font-size: 12.5px; color: var(--muted); font-style: italic; }
  .card-summary { font-size: 13.5px; color: var(--text); opacity: .88; }
  .card-relevance { margin-top: 10px; border-left: 3px solid var(--accent); border-radius: 4px; background: var(--accent-light); padding: 8px 12px; }
  .card-relevance-label { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); opacity: .8; margin-bottom: 3px; }
  .card-relevance-text { font-size: 13px; color: var(--accent); font-style: italic; line-height: 1.45; }
  .card-tags { display: flex; flex-wrap: wrap; gap: 5px; }
  .tag { font-size: 11.5px; padding: 2px 8px; border-radius: 10px; background: var(--tag-bg); color: var(--tag-text); cursor: pointer; }
  .tag:hover { opacity: .8; }
  .card-actions { display: flex; gap: 8px; margin-top: 2px; align-items: center; }
  .btn-pdf { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 7px; background: var(--accent-light); color: var(--accent); text-decoration: none; border: 1px solid currentColor; opacity: .85; transition: opacity .12s; }
  .btn-pdf:hover { opacity: 1; }
  .notes-section { margin-top: 6px; }
  .notes-toggle { background: none; border: none; padding: 0; font-size: 12px; color: var(--muted); cursor: pointer; display: flex; align-items: center; gap: 4px; transition: color .12s; }
  .notes-toggle:hover { color: var(--accent); }
  .notes-toggle.has-notes { color: var(--accent); font-weight: 600; }
  .notes-area { display: none; margin-top: 6px; }
  .notes-area.open { display: block; }
  .notes-textarea { width: 100%; min-height: 72px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 7px; background: var(--bg); color: var(--text); font-size: 13px; font-family: inherit; line-height: 1.5; resize: vertical; outline: none; transition: border-color .12s; }
  .notes-textarea:focus { border-color: var(--accent); }
  .notes-saved { font-size: 11px; color: var(--muted); margin-top: 3px; min-height: 14px; }
  .empty { text-align: center; padding: 64px 0; color: var(--muted); font-size: 15px; grid-column: 1/-1; }
  .btn-add { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; padding: 7px 14px; border-radius: 8px; background: var(--accent); color: #fff; text-decoration: none; border: none; cursor: pointer; transition: opacity .12s; white-space: nowrap; }
  .btn-add:hover { opacity: .85; }
  .card-notes { margin-top: 4px; }
  .notes-textarea { width: 100%; min-height: 52px; padding: 7px 10px; border: 1px dashed var(--border); border-radius: 7px; background: transparent; color: var(--text); font-size: 12.5px; font-family: inherit; line-height: 1.5; resize: vertical; outline: none; transition: border-color .15s, background .15s; }
  .notes-textarea::placeholder { color: var(--muted); opacity: .7; font-style: italic; }
  .notes-textarea:focus { border-color: var(--accent); border-style: solid; background: var(--accent-light); }
</style>
</head>
<body>

<!-- Password overlay -->
<div id="pw-overlay">
  <div id="pw-box">
    <h2>Ru's Reading List</h2>
    <p>Enter the password to continue.</p>
    <input id="pw-input" type="password" placeholder="Password" autocomplete="current-password">
    <div id="pw-error"></div>
    <button id="pw-btn">Unlock</button>
  </div>
</div>

<header>
  <div class="header-inner">
    <div class="header-title">Ru's Reading List <span>· Cell Science</span></div>
    <input id="search" type="search" placeholder="Search title, author, journal…" autocomplete="off">
    <div id="result-count"></div>
    <a class="btn-add" href="https://github.com/ismi-ops/literature-rg/actions/workflows/add_paper.yml" target="_blank" rel="noopener">+ Add paper</a>
  </div>
</header>
<div class="filters">
  <div class="filters-inner">
    <div class="filter-row" id="type-filters"><span class="filter-label">Type</span></div>
    <div class="filter-row" id="tag-filters"><span class="filter-label">Topic</span></div>
    <div class="filter-row" id="year-filters"><span class="filter-label">Year</span></div>
    <div class="filter-row" id="added-filters"><span class="filter-label">Added</span></div>
  </div>
</div>
<main><div class="grid" id="grid"></div></main>

<script>
/* ── Password gate ──────────────────────────────────────────────────────── */
const PW_KEY = 'rg_unlocked';
const CORRECT_PW = 'RG-literature';
const overlay = document.getElementById('pw-overlay');
function unlock() {
  overlay.style.display = 'none';
  localStorage.setItem(PW_KEY, '1');
}
if (localStorage.getItem(PW_KEY) === '1') { unlock(); }
document.getElementById('pw-btn').addEventListener('click', () => {
  if (document.getElementById('pw-input').value === CORRECT_PW) {
    unlock();
  } else {
    document.getElementById('pw-error').textContent = 'Incorrect password.';
  }
});
document.getElementById('pw-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('pw-btn').click();
  document.getElementById('pw-error').textContent = '';
});

/* ── Data ───────────────────────────────────────────────────────────────── */
const PAPERS = [{"title": "A human epiblast model reveals dynamic TGFβ-mediated control of epithelial identity during mammalian epiblast development", "authors": "I. Zorzan, Elena Carbognin, Andrea Lauria, V. Proserpio, Davide Benvegnù, Federica Bertelli, Susana De Juambelz Urías, Caterina Dalrio et al.", "year": "2026", "journal": "Nature Cell Biology", "type": "research", "summary": "This paper develops a stem cell-based model of the human epiblast — the early embryonic tissue that gives rise to all cell types — and uses it to show that TGFβ signaling dynamically controls the transition between epithelial and non-epithelial identities during this critical window. It's a methods and biology paper simultaneously, demonstrating how in vitro human embryo models can reveal regulatory logic that can't be studied in vivo. Connects to Cell Science's interest in stem cell biology, cell identity, and the tools we use to model human development.", "tags": ["stem cells", "development", "morphogenesis"], "doi": "10.1038/s41556-025-01831-6", "link": "https://www.nature.com/articles/s41556-025-01831-6", "added": "2026-08-19", "pdf_link": "", "relevance": "Relevant to Cell Science's foundational interest in how cells and tissues build organisms through coordinated developmental programs."}, {"title": "A systems view of cellular heterogeneity: Unlocking the \"wheel of fate\"", "authors": "", "year": "2025", "journal": "Cell Systems", "type": "perspective", "summary": "Frames cell fate as a stochastic 'wheel' that each cell spins in response to molecular inputs, with the outcome depending on both the signal and the cell's internal state. The paper argues that single-cell heterogeneity isn't noise to be averaged away but meaningful variation encoding information about cell identity and trajectory. Connects well to Cell Science's work on cell state and how cells within the same population make distinct decisions.", "tags": ["cell fate", "cell state"], "doi": "", "link": "https://www.cell.com/cell-systems/abstract/S2405-4712(25)00133-4", "added": "2026-08-19", "pdf_link": "", "relevance": "Directly addresses Cell Science's core question of why genetically identical cells differ structurally and how variation encodes functional information."}, {"title": "Adherens junctions as molecular regulators of emergent tissue mechanics", "authors": "", "year": "2024", "journal": "Nature Reviews Molecular Cell Biology", "type": "review", "summary": "Reviews how adherens junctions — the molecular complexes that physically link neighboring cells — do more than just hold tissue together. They actively regulate the mechanical properties of tissues at a collective scale, including their fluid-to-solid transitions, through dynamic remodeling and force transmission. Bridges molecular cell biology and tissue-scale mechanics in a way that directly supports Cell Science's interest in how cell-level structure gives rise to tissue-level function.", "tags": ["tissue mechanics", "morphogenesis"], "doi": "", "link": "https://www.nature.com/articles/s41580-023-00688-7", "added": "2026-08-19", "pdf_link": "", "relevance": "Supports Cell Science's interest in tissue mechanics and how physical forces govern cell behavior, tissue organization, and morphogenesis."}, {"title": "Advancing mechanobiology from single molecules to complex cellular systems", "authors": "Kasuba, Fläschner, Jain, Krieg, Liberali et al.", "year": "2026", "journal": "Nature Nanotechnology", "type": "review", "summary": "A multi-institutional perspective including Prisca Liberali that maps open challenges in mechanobiology, arguing the field must leap from single-molecule studies to understanding mechanical behavior across full multicellular complexity. Proposes three challenges: better engineered multicellular reference systems, new tools to measure mechanics across scales, and theory to unify the data. Relevant to Cell Science via the Liberali connection and the tissue mechanics thread running through current cell science.", "tags": ["mechanobiology", "tissue mechanics", "morphogenesis"], "doi": "10.1038/s41565-026-02179-0", "link": "https://www.nature.com/articles/s41565-026-02179-0", "added": "2026-08-19", "pdf_link": "https://eprints.gla.ac.uk/view/journal_volume/Nature_Nanotechnology.html>,", "relevance": "Supports Cell Science's interest in tissue mechanics and how physical forces govern cell behavior, tissue organization, and morphogenesis."}, {"title": "Bioelectricity in Morphogenesis", "authors": "Nunes & Barriga", "year": "2025", "journal": "Annual Review of Cell and Developmental Biology", "type": "review", "summary": "Reviews how cells generate and perceive bioelectrical inputs — ion gradients and membrane voltages — and how these translate into responses that influence tissue morphogenesis in physiology and pathology. Despite bioelectricity being as old as life itself, its roles in non-neural contexts remain underexplored; this review synthesizes what is known and where the field is headed. Particularly valuable for understanding bioelectric signaling as a layer of developmental control operating in parallel to genetic programs.", "tags": ["morphogenesis", "development", "cell fate", "mechanobiology", "bioelectricity"], "doi": "10.1146/annurev-cellbio-101323-032747", "link": "https://www.annualreviews.org/content/journals/10.1146/annurev-cellbio-101323-032747", "added": "2026-08-19", "pdf_link": "https://doi.org/10.1146/annurev-cellbio-101323-032747", "relevance": "Relevant to Cell Science's interest in tissue self-organization, emergent patterning, and the physical principles shaping biological structures. Touches on bioelectric signaling mechanisms relevant to Cell Science's broader interest in non-canonical developmental signals in morphogenesis."}, {"title": "Break to build: fracture as a unifying morphogenetic strategy", "authors": "Rashmi Priya", "year": "2026", "journal": "Development", "type": "research", "summary": "Proposes that controlled fracture — the deliberate breaking of tissue integrity — is a broadly conserved and underappreciated strategy in morphogenesis, used across organ systems to create lumens, tubes, and cavities. Rashmi Priya's lab frames fracture not as failure but as a constructive mechanical event that generates architecture. A conceptually fresh take on morphogenesis with implications for how we think about lumen formation and tissue sculpting, both active areas for Cell Science.", "tags": ["morphogenesis", "development"], "doi": "", "link": "https://journals.biologists.com/dev/article/153/16/dev205136/370625/Break-to-build-fracture-as-a-unifying", "added": "2026-08-19", "pdf_link": "", "relevance": "Relevant to Cell Science's interest in tissue self-organization, emergent patterning, and the physical principles shaping biological structures."}, {"title": "Building a Synthetic Cell Together", "authors": "Multiple authors", "year": "2025", "journal": "Nature Communications", "type": "perspective", "summary": "A community perspective laying out the major scientific hurdles in building a cell from non-living components, including how to ensure compatibility across diverse synthetic subsystems, and proposing strategies for moving forward. Published just ahead of the Adamala synthetic cell that divides paper, making it a perfect conceptual companion piece. Directly relevant to understanding what life requires at its most fundamental level and to efforts in bottom-up synthetic biology.", "tags": ["synthetic biology", "self-organization", "cell state"], "doi": "10.1038/s41467-025-62778-8", "link": "https://www.nature.com/articles/s41467-025-62778-8", "added": "2026-08-19", "pdf_link": "https://www.nature.com/articles/s41467-025-62778-8.pdf", "relevance": "Aligned with the CellScapes program and Cell Science's engagement with synthetic developmental biology — engineering gene circuits to program cell community behavior."}, {"title": "Challenges and potential applications of AI in systems biology", "authors": "Na Sun", "year": "2026", "journal": "Nature Reviews Molecular Cell Biology", "type": "perspective", "summary": "A forward-looking Comment in NatRevMCB proposing how AI can transform systems biology, specifically calling for predictive, interpretable, and generative frameworks that bridge molecular data to organism-level insights. Pairs well with the Theis compositional foundation models paper, adding a systems biology dimension to the AI thread.", "tags": ["AI / ML", "cell state", "single-cell"], "doi": "10.1038/s41580-025-00934-0", "link": "https://www.nature.com/articles/s41580-025-00934-0", "added": "2026-08-19", "pdf_link": "", "relevance": "Relevant to Cell Science's AI and computational agenda for modeling cell biology and building virtual cell frameworks."}, {"title": "Computational blueprints for cell fate programming", "authors": "Yang", "year": "2026", "journal": "Stem Cell Reports", "type": "review", "summary": "A focused review of how computational methods — single-cell omics, perturbation modeling, and deep learning — are being integrated with experimental approaches to make cell fate engineering more predictive and reproducible. Distinguishes approaches that are actionable today from those still developing, giving a realistic map of where the field is vs. where it aspires to be. Directly relevant to Cell Science's growing investment in computational approaches to cell state and identity.", "tags": ["cell fate", "AI / ML", "single-cell", "cell state"], "doi": "", "link": "https://www.cell.com/stem-cell-reports/fulltext/S2213-6711(26)00140-2", "added": "2026-08-19", "pdf_link": "", "relevance": "Relevant to Cell Science's interest in how cells make identity decisions, with implications for stem cell differentiation and iPSC-based model systems."}, {"title": "Control of spatio-temporal patterning via cell growth in a multicellular synthetic gene circuit", "authors": "Leonardo Morsut", "year": "2025", "journal": "Nature Communications", "type": "research", "summary": "Morsut and colleagues engineer a synthetic gene circuit in which cell growth rate is coupled to spatial patterning, demonstrating that you can program when and where different cell identities emerge in a multicellular population simply by controlling proliferation dynamics. A key step toward building synthetic tissues with programmable architecture. Directly relevant to Cell Science's interest in synthetic biology as a tool for understanding and engineering cell fate.", "tags": ["synthetic biology", "multicellular", "morphogenesis", "gene circuits"], "doi": "", "link": "https://www.nature.com/articles/s41467-024-53078-8", "added": "2026-08-19", "pdf_link": "", "relevance": "Aligned with CellScapes' use of engineered gene circuits to program synthetic cell communities toward controlled tissue-level behaviors. Relevant to CellScapes and Cell Science's broader interest in how cells cooperate and self-organize to form tissues with emergent properties."}, {"title": "Coping with uncertainty: Challenges for robust pattern formation in dynamical tissues", "authors": "Tony Tsai", "year": "2026", "journal": "Seminars in Cell & Developmental Biology", "type": "review", "summary": "Addresses a fundamental puzzle in developmental biology: how do tissues generate precise, reproducible patterns despite the inherent noise in gene expression and cell behavior? Tony Tsai and colleagues review the strategies — feedback, redundancy, mechanical constraints — that allow robust patterning to emerge from noisy components. Connects to the broader question of how cell decision-making at the individual level produces reliable outcomes at the tissue level, a question central to Cell Science.", "tags": ["morphogenesis", "cell fate", "development"], "doi": "", "link": "https://www.sciencedirect.com/science/article/pii/S1084952125000394", "added": "2026-08-19", "pdf_link": "", "relevance": "Relevant to Cell Science's interest in how spatial patterns emerge during development from molecular and cellular interactions."}, {"title": "Coupling of cell shape, matrix and tissue dynamics ensures embryonic patterning robustness", "authors": "", "year": "2025", "journal": "Nature Cell Biology", "type": "research", "summary": "Shows that patterning robustness in early embryos depends not just on signaling but on the interplay between cell shape changes, the extracellular matrix, and tissue-level mechanical dynamics working together. Using iPSC-based embryo models, the paper demonstrates how these physical factors buffer developmental programs against perturbation. Connects iPSC biology with mechanobiology and patterning in a way that bridges multiple Cell Science-relevant research areas.", "tags": ["stem cells", "morphogenesis", "tissue mechanics"], "doi": "", "link": "https://www.nature.com/articles/s41556-025-01618-9", "added": "2026-08-19", "pdf_link": "", "relevance": "Relevant to Cell Science's interest in how spatial patterns emerge during development from molecular and cellular interactions."}, {"title": "Curvature feedback for repetitive tissue morphogenesis – Bridging algorithmic principles and self-regulatory systems", "authors": "Emmanuel Vikran, Tsuyoshi Hirashima", "year": "2025", "journal": "Seminars in Cell & Developmental Biology", "type": "review", "summary": "Argues that repetitive tissue structures — like the periodic arrangement of hair follicles, teeth, or somites — are generated through a curvature-feedback loop in which the local geometry of the tissue influences where the next structure forms, creating a self-organizing spatial program. The bridging of algorithmic principles and biological self-regulation is the conceptual contribution. Relevant to Cell Science's interest in the physical rules governing tissue-level organization and patterning.", "tags": ["morphogenesis", "self-organization", "development"], "doi": "10.1016/j.semcdb.2025.103633", "link": "https://www.sciencedirect.com/science/article/pii/S1084952125000436", "added": "2026-08-19", "pdf_link": "https://doi.org/10.1016/j.semcdb.2025.103633", "relevance": "Relevant to Cell Science's interest in tissue self-organization, emergent patterning, and the physical principles shaping biological structures."}, {"title": "Data modeling the interplay between single-cell shape, single-cell protein expression, and tissue state", "authors": "", "year": "2026", "journal": "Cell Reports Methods", "type": "research", "summary": "Using multiplexed imaging and machine learning across multiple disease cohorts, Tamir et al. establish a bidirectional, universal link between a cell's physical shape and its protein expression — with shape predicting protein levels beyond what cell type alone can explain. Notably, larger tumor cells enriched for p53 expression were identified across cancer types. This work validates morphological readouts as meaningful molecular proxies and is closely aligned with Cell Science's imaging and cell state research programs.", "tags": ["morphology", "cell state", "AI / ML", "single-cell"], "doi": "", "link": "https://www.cell.com/cell-reports-methods/fulltext/S2667-2375(26)00163-3", "added": "2026-08-19", "pdf_link": "", "relevance": "Relevant to Cell Science's multimodal view of cell state, where single-cell molecular data is integrated with structural and morphological measurements."}, {"title": "Deciphering mechanical determinants of morphological evolution", "authors": "", "year": "2026", "journal": "Cell", "type": "research", "summary": "Examines how differences in tissue mechanical properties — stiffness, viscosity, active force generation — have driven the evolution of diverse animal body forms across species. Rather than focusing on genetic differences, it asks what physical constraints and possibilities shaped morphological diversity. A broad evolutionary perspective on the biophysics of development that connects mechanobiology to deep questions about form and function relevant to Cell Science.", "tags": ["morphogenesis", "development", "mechanobiology"], "doi": "", "link": "https://www.sciencedirect.com/science/article/pii/S0092867426001753", "added": "2026-08-19", "pdf_link": "", "relevance": "Relevant to Cell Science's interest in tissue self-organization, emergent patterning, and the physical principles shaping biological structures. Supports Cell Science's interest in tissue mechanics and how physical forces govern cell behavior, tissue organization, and morphogenesis."}, {"title": "Decoding the origins of cellular self-organization for engineered biology", "authors": "Qi Chen, Magda Zernicka-Goetz", "year": "2026", "journal": "Nature Biotechnology", "type": "perspective", "summary": "Zernicka-Goetz, Chen, and colleagues argue that understanding cellular self-organization from first principles — how and why cells spontaneously form ordered structures — is the key to engineering biology that genuinely mimics development. The perspective traces what we know about self-organization from embryo models and stem cell systems and makes a case for where the field needs to go. A direct complement to Cell Science's interests in synthetic morphogenesis and the physical logic of tissue formation.", "tags": ["synthetic biology", "self-organization", "multicellular", "morphogenesis"], "doi": "", "link": "https://www.nature.com/articles/s41587-026-03161-w", "added": "2026-08-19", "pdf_link": "", "relevance": "Relevant to Cell Science's interest in emergent tissue organization and how multicellular systems self-pattern without external instruction."}, {"title": "Designing soft materials through synthetic morphogenesis", "authors": "Bortnikov et al.", "year": "2026", "journal": "Nature Communications", "type": "research", "summary": "Applies Turing-type reaction-diffusion morphogenesis to materials chemistry, using a thiol-based chemical reaction network to produce stationary patterns in soft polyacrylamide hydrogels — the first demonstration of Turing patterning compatible with materials functionalization. The approach allows derivatization of patterned regions with dyes, enzymes, and crosslinkers, opening a route to materials with spatially programmed properties. A compelling bridge between the physical principles of morphogenesis and a new synthetic application domain.", "tags": ["synthetic morphogenesis", "Turing patterning", "self-organization", "morphogenesis"], "doi": "10.1038/s41467-026-71999-4", "link": "https://www.nature.com/articles/s41467-026-71999-4", "added": "2026-08-19", "pdf_link": "https://www.nature.com/articles/s41467-026-71999-4_reference.pdf", "relevance": "Relevant to Cell Science's interest in tissue self-organization, emergent patterning, and the physical principles shaping biological structures."}, {"title": "Discovering what is possible: How synthetic biology illuminates development", "authors": "Nicholas T. Hutchins, Alexandra Cao, Pulin Li", "year": "2026", "journal": "Cell Systems", "type": "perspective", "summary": "Argues that synthetic biology systems are uniquely powerful tools for identifying causal mechanisms of multicellular organization and building predictive models of development. The 'what is possible' framing positions synthetic approaches not just as engineering tools but as an epistemic strategy for understanding how complex tissues emerge from simple rules. Directly relevant to Cell Science's interest in cell state, fate decisions, and the logic of multicellular self-organization.", "tags": ["synthetic biology", "development", "multicellular", "cell fate"], "doi": "10.1016/j.cels.2026.101619", "link": "https://www.sciencedirect.com/science/article/abs/pii/S2405471226001018", "added": "2026-08-19", "pdf_link": "", "relevance": "Aligned with the CellScapes program and Cell Science's engagement with synthetic developmental biology — engineering gene circuits to program cell community behavior. Relevant to Cell Science's foundational interest in how cells and tissues build organisms through coordinated developmental programs."}, {"title": "Engineering development: From the repressilator and toggle switch to synthetic developmental biology", "authors": "Saha et al.", "year": "2025", "journal": "Developmental Biology", "type": "perspective", "summary": "Traces how the Elowitz repressilator and Collins toggle switch introduced a 'build to understand' philosophy that has since transformed how the field studies signaling, cell fate, and patterning. Uses these landmark papers as the origin story of synthetic developmental biology and maps where the field is headed. Directly engages with Elowitz's intellectual legacy and connects to Cell Science's interest in gene circuits and cell state transitions.", "tags": ["synthetic biology", "gene circuits", "cell fate"], "doi": "", "link": "https://www.sciencedirect.com/science/article/pii/S0012160625001800", "added": "2026-08-19", "pdf_link": "", "relevance": "Aligned with the CellScapes program and Cell Science's engagement with synthetic developmental biology — engineering gene circuits to program cell community behavior. Relevant to Cell Science's foundational interest in how cells and tissues build organisms through coordinated developmental programs."}, {"title": "Engineering morphogenesis of cell clusters with differentiable programming", "authors": "", "year": "2025", "journal": "Nature Computational Science", "type": "research", "summary": "Introduces a computational framework where the rules governing cell cluster shape changes can be optimized using gradient descent — essentially training a developmental program the way you'd train a neural network. Applied to real cell clusters, it can infer the mechanical rules producing observed morphologies and design new ones. A methodological advance at the intersection of AI, synthetic morphogenesis, and mechanobiology that connects directly to Cell Science's computational and imaging work.", "tags": ["synthetic biology", "morphogenesis", "AI / ML"], "doi": "", "link": "https://www.nature.com/articles/s43588-025-00851-4", "added": "2026-08-19", "pdf_link": "", "relevance": "Relevant to Cell Science's interest in tissue self-organization, emergent patterning, and the physical principles shaping biological structures."}, {"title": "From modality-specific to compositional foundation models for cell biology", "authors": "Bahrami, Richter, Schmacke, Egea Lavandera & Theis", "year": "2026", "journal": "Cell Systems", "type": "perspective", "summary": "Argues that the next frontier for AI in cell biology isn't bigger single-purpose models, but modular, composable architectures — specialized modules per data type connected through learned interfaces. Makes a practical case for why this compositional approach is more realistic than training one monolithic model on everything. A roadmap for the computational infrastructure that would unify and amplify multimodal biological datasets like those Cell Science generates.", "tags": ["AI / ML", "cell state", "multimodal"], "doi": "", "link": "https://www.cell.com/cell-systems/fulltext/S2405-4712(26)00016-5", "added": "2026-08-19", "pdf_link": "", "relevance": "Relevant to Cell Science's AI and computational agenda for modeling cell biology and building virtual cell frameworks."}, {"title": "Generic comparison of lumen nucleation and fusion in epithelial organoids with and without hydrostatic pressure", "authors": "", "year": "2025", "journal": "Nature Communications", "type": "research", "summary": "Systematically compares the two known routes to lumen formation in epithelial organoids — nucleation (growing a lumen from scratch) versus fusion (merging smaller fluid pockets) — and examines how hydrostatic pressure modulates each pathway. Provides quantitative benchmarks for lumenogenesis that can inform both experimental design and theoretical models. Relevant to Cell Science's interest in 3D cell organization and the physical mechanisms of tissue self-assembly.", "tags": ["organoid", "morphogenesis", "development"], "doi": "", "link": "https://www.nature.com/articles/s41467-025-60780-8", "added": "2026-08-19", "pdf_link": "", "relevance": "Relevant to Cell Science's interest in organoid systems, lumen formation mechanics, and live imaging of three-dimensional culture morphodynamics."}, {"title": "Large-scale control over collective cell migration using light-activated epidermal growth factor receptors", "authors": "Jared Toettcher", "year": "2025", "journal": "Cell Systems", "type": "research", "summary": "Toettcher and colleagues use optogenetics to activate EGF receptor signaling in spatially defined patterns across cell sheets, demonstrating precise, real-time control over collective cell migration in 2D. By turning signaling on and off with light, they can direct cell flow at scales relevant to tissue morphogenesis. A compelling synthetic biology tool for studying and engineering collective behavior — relevant to Cell Science's interest in how cell-level signaling produces tissue-level movement.", "tags": ["synthetic biology", "morphogenesis", "cell fate"], "doi": "", "link": "https://www.cell.com/cell-systems/abstract/S2405-4712(25)00036-5", "added": "2026-08-19", "pdf_link": "", "relevance": "Relevant to Cell Science's interest in collective cell behaviors, emergent tissue dynamics, and the mechanics of coordinated cell movement."}, {"title": "Lumens as active balloons: a biological physics review", "authors": "", "year": "2026", "journal": "arXiv", "type": "review", "summary": "Proposes a unifying physical framework for understanding how lumens — the fluid-filled cavities that give organs like the gut, lungs, and kidneys their hollow structure — form and are maintained. The authors reframe lumenogenesis as a problem in biological active matter physics, describing lumens as 'active balloons' whose size and stability emerge from osmotic pressure, cell tension, and mechanochemical feedback. Connects to Cell Science's interest in epithelial organization and 3D tissue architecture.", "tags": ["morphogenesis", "development", "tissue mechanics"], "doi": "", "link": "https://arxiv.org/pdf/2605.01649", "added": "2026-08-19", "pdf_link": "", "relevance": "Relevant to Cell Science's interest in organoid systems, lumen formation mechanics, and live imaging of three-dimensional culture morphodynamics."}, {"title": "Mapping, Modeling, and Reprogramming Cell-Fate Decision-Making Systems", "authors": "Ham, Woodward, Coomer & Stumpf", "year": "2025", "journal": "Annual Review of Biomedical Data Science", "type": "review", "summary": "Treats cell fate as fundamentally an information processing and decision-making problem, covering mathematical models of cell fate systems across the tree of life and mapping what design principles we can learn from observations to redesign cellular behavior. Coming from Annual Reviews, it provides the authoritative, field-spanning quality of a proper state-of-the-field piece. Brings a mathematical modeling and systems biology angle that complements wetlab and imaging approaches to cell identity and fate control.", "tags": ["cell fate", "cell state", "AI / ML", "development"], "doi": "10.1146/annurev-biodatasci-101424-121439", "link": "https://www.annualreviews.org/content/journals/10.1146/annurev-biodatasci-101424-121439", "added": "2026-08-19", "pdf_link": "https://doi.org/10.1146/annurev-biodatasci-101424-121439", "relevance": "Relevant to Cell Science's interest in how cells make identity decisions, with implications for stem cell differentiation and iPSC-based model systems."}, {"title": "Measuring and manipulating mechanical forces during development", "authors": "Sara Wickstrom", "year": "2025", "journal": "Nature Cell Biology", "type": "review", "summary": "Wickstrom and colleagues review the current toolkit for measuring and perturbing physical forces during embryonic development, including atomic force microscopy, laser ablation, optogenetic force actuators, and biosensors. More than a methods catalog, it articulates what questions these tools can and can't answer and identifies the gaps. Practical context for anyone thinking about mechanobiology experiments and directly relevant to the physical biology thread running through Cell Science research.", "tags": ["mechanobiology", "morphogenesis", "development"], "doi": "", "link": "https://www.nature.com/articles/s41556-025-01632-x", "added": "2026-08-19", "pdf_link": "", "relevance": "Supports Cell Science's interest in tissue mechanics and how physical forces govern cell behavior, tissue organization, and morphogenesis. Relevant to Cell Science's foundational interest in how cells and tissues build organisms through coordinated developmental programs."}, {"title": "Mechanical control of cell fate decisions in the skin epidermis", "authors": "Edouard Hannezo", "year": "2026", "journal": "Nature Communications", "type": "research", "summary": "Hannezo and colleagues show that mechanical forces — specifically those generated as cells divide and the epidermis grows — directly influence which cell fate a skin progenitor adopts, independently of biochemical signals. The work establishes a quantitative link between tissue mechanics and fate decisions in a regenerative tissue context. Connects mechanobiology to cell identity in a way that deepens the framework Cell Science uses to think about how structure determines function.", "tags": ["mechanobiology", "cell fate", "morphogenesis"], "doi": "", "link": "https://www.nature.com/articles/s41467-025-62882-9", "added": "2026-08-19", "pdf_link": "", "relevance": "Relevant to Cell Science's interest in how cells make identity decisions, with implications for stem cell differentiation and iPSC-based model systems."}, {"title": "Mechanical forces across compartments coordinate cell shape and fate transitions to generate tissue architecture", "authors": "Sara Wickstrom, Lisa Manning", "year": "2024", "journal": "Nature Cell Biology", "type": "research", "summary": "Wickstrom and Manning show that mechanical forces don't just act within single tissue layers — they propagate across compartment boundaries to coordinate shape changes and fate decisions between adjacent cell populations. This cross-compartment communication turns out to be essential for generating the correct tissue architecture during development. Provides mechanistic grounding for how cells in different layers 'talk' through physical forces, highly relevant to Cell Science's interest in multicellular coordination.", "tags": ["mechanobiology", "cell fate", "morphogenesis", "tissue mechanics"], "doi": "", "link": "https://www.nature.com/articles/s41556-023-01332-4", "added": "2026-08-19", "pdf_link": "", "relevance": "Relevant to Cell Science's interest in how cells make identity decisions, with implications for stem cell differentiation and iPSC-based model systems. Supports Cell Science's interest in tissue mechanics and how physical forces govern cell behavior, tissue organization, and morphogenesis."}, {"title": "New developments and applications of human organoids", "authors": "Multiple authors", "year": "2026", "journal": "Nature Reviews Molecular Cell Biology", "type": "review", "summary": "A forward-looking NatRevMCB review covering where organoid technology is headed next, explicitly mapping the move toward next-generation organoids that better capture cellular interactions, tissue architecture, and microenvironmental cues. Given Cell Science's deep connection to iPSC biology and 3D tissue modeling this is a quality fit, and coming from NatRevMCB rather than a lower-tier journal it carries the weight the topic deserves.", "tags": ["organoid", "stem cells", "development", "morphogenesis"], "doi": "10.1038/s41580-026-00974-0", "link": "https://www.nature.com/articles/s41580-026-00974-0", "added": "2026-08-19", "pdf_link": "", "relevance": "Relevant to Cell Science's interest in organoid systems, lumen formation mechanics, and live imaging of three-dimensional culture morphodynamics. Relevant to Cell Science's foundational interest in how cells and tissues build organisms through coordinated developmental programs."}, {"title": "Open problems in synthetic multicellularity", "authors": "Jordi Garcia-Ojalvo", "year": "2024", "journal": "NPJ Systems Biology and Applications", "type": "perspective", "summary": "A panoramic perspective from Garcia-Ojalvo and colleagues — including Levin — that catalogues the fundamental unsolved problems in engineering multicellular systems from scratch: how to generate stable cell-type diversity, how emergent properties arise, and what the evolutionary logic of multicellularity can teach us about synthetic design. Elowitz lab work on synthetic cell fate is a key reference. An essential map of the field's frontier for anyone working on synthetic morphogenesis or cell fate engineering.", "tags": ["synthetic biology", "multicellular"], "doi": "", "link": "https://www.nature.com/articles/s41540-024-00477-8", "added": "2026-08-19", "pdf_link": "", "relevance": "Relevant to CellScapes and Cell Science's broader interest in how cells cooperate and self-organize to form tissues with emergent properties."}, {"title": "Patterning in motion: Cell interfaces guide mesenchymal collective migration and morphogenesis", "authors": "", "year": "2026", "journal": "Journal of Cell Biology", "type": "perspective", "summary": "Argues that cell-cell interfaces — the boundaries between mesenchymal cells of different identities — are not passive but actively guide the direction and organization of collective migration during morphogenesis. The 'patterning in motion' framing captures how spatial organization and movement are coupled rather than sequential. Relevant to Cell Science's interest in how cell identity and spatial organization emerge together during tissue formation.", "tags": ["morphogenesis", "cell fate"], "doi": "", "link": "https://rupress.org/jcb/article/224/11/e202505198/278333/", "added": "2026-08-19", "pdf_link": "", "relevance": "Relevant to Cell Science's interest in tissue self-organization, emergent patterning, and the physical principles shaping biological structures. Relevant to Cell Science's interest in collective cell behaviors, emergent tissue dynamics, and the mechanics of coordinated cell movement."}, {"title": "Permeability-driven pressure and cell proliferation control lumen morphogenesis in pancreatic organoids", "authors": "", "year": "2026", "journal": "Nature Cell Biology", "type": "research", "summary": "Using pancreatic organoids, this paper dissects how lumen size is controlled by two independent parameters: fluid pressure driven by epithelial permeability, and mechanical feedback from cell proliferation. The interplay of these two inputs determines whether a lumen grows, stabilizes, or collapses. A quantitative mechanobiology paper with direct implications for understanding organoid architecture — relevant to Cell Science's growing interest in lumenoids and 3D tissue models.", "tags": ["organoid", "morphogenesis", "development"], "doi": "", "link": "https://www.nature.com/articles/s41556-025-01832-5", "added": "2026-08-19", "pdf_link": "", "relevance": "Relevant to Cell Science's interest in tissue self-organization, emergent patterning, and the physical principles shaping biological structures. Relevant to Cell Science's interest in organoid systems, lumen formation mechanics, and live imaging of three-dimensional culture morphodynamics."}, {"title": "Present and future of synthetic cell development", "authors": "Adamala, Dogterom, Elani, Schwille, Takinoue & Tang", "year": "2024", "journal": "Nature Reviews Molecular Cell Biology", "type": "perspective", "summary": "A panel of leading experts in synthetic cell research — including Adamala, whose lab produced the first synthetic cell that can grow and divide — discusses what a synthetic cell actually is, what has been achieved so far, and what the key challenges and future opportunities are. A short, accessible NatRevMCB Viewpoint that grounds the more abstract synthetic biology thread in concrete current science.", "tags": ["synthetic biology", "self-organization", "cell state"], "doi": "10.1038/s41580-023-00686-9", "link": "https://www.nature.com/articles/s41580-023-00686-9", "added": "2026-08-19", "pdf_link": "", "relevance": "Relevant to Cell Science's foundational interest in how cells and tissues build organisms through coordinated developmental programs."}, {"title": "Programmed and self-organized flow of information during morphogenesis", "authors": "C. Collinet, Thomas Lecuit", "year": "2021", "journal": "Nature Reviews Molecular Cell Biology", "type": "review", "summary": "Collinet and Lecuit's landmark review argues that tissue morphogenesis is governed by two distinct modes of information flow: programmed (hierarchical, gene-driven instructions) and self-organized (emergent from local physical and chemical interactions). Neither alone is sufficient — tissues use both, often simultaneously. A foundational conceptual framework for the field that has shaped how researchers think about patterning and form-generation, and a key reference for Cell Science's synthetic morphogenesis interests.", "tags": ["morphogenesis", "self-organization", "development"], "doi": "10.1038/s41580-020-00318-6", "link": "https://www.nature.com/articles/s41580-020-00318-6", "added": "2026-08-19", "pdf_link": "", "relevance": "Relevant to Cell Science's interest in tissue self-organization, emergent patterning, and the physical principles shaping biological structures. Relevant to Cell Science's interest in emergent tissue organization and how multicellular systems self-pattern without external instruction."}, {"title": "Programming the elongation of mammalian cell aggregates with synthetic gene circuits", "authors": "Leonardo Morsut", "year": "2025", "journal": "bioRxiv", "type": "research", "summary": "Morsut and colleagues demonstrate that synthetic gene circuits can be used to program elongation — directional shape change — in aggregates of mammalian cells, without relying on natural developmental signals. By controlling cell-cell adhesion and signaling through engineered circuits, they generate reproducible tissue elongation on demand. A significant step toward building synthetic tissues with defined geometries, connecting directly to Cell Science's interests in synthetic morphogenesis.", "tags": ["synthetic biology", "morphogenesis", "gene circuits"], "doi": "", "link": "https://www.biorxiv.org/content/10.1101/2024.12.11.627621v1", "added": "2026-08-19", "pdf_link": "https://www.biorxiv.org/content/10.1101/2024.12.11.627621v1.full.pdf", "relevance": "Aligned with CellScapes' use of engineered gene circuits to program synthetic cell communities toward controlled tissue-level behaviors."}, {"title": "Scaling up complexity in synthetic developmental biology", "authors": "Miki Ebisuya", "year": "2022", "journal": "Science", "type": "review", "summary": "Ebisuya's perspective in Science argues that the field of synthetic developmental biology is ready to move beyond demonstrating simple patterning and tackle genuine multicellular complexity — building systems with multiple interacting cell types, dynamic transitions, and emergent architecture. Reviews what has been achieved with gene circuits, organoids, and optogenetics, and maps the challenges ahead. A key field-defining piece for anyone interested in where synthetic biology and developmental biology converge.", "tags": ["synthetic biology", "development"], "doi": "", "link": "https://www.science.org/doi/10.1126/science.add9666", "added": "2026-08-19", "pdf_link": "", "relevance": "Aligned with the CellScapes program and Cell Science's engagement with synthetic developmental biology — engineering gene circuits to program cell community behavior. Relevant to Cell Science's foundational interest in how cells and tissues build organisms through coordinated developmental programs."}, {"title": "Searching for physical principles of morphogenesis", "authors": "Sebastian Streichan", "year": "2025", "journal": "Development", "type": "perspective", "summary": "Streichan and colleagues make a case for a physics-driven approach to morphogenesis — one that seeks general, abstract principles governing how tissues change shape, independent of the specific molecules involved. They argue that the field needs theoretical frameworks that can predict morphogenetic outcomes from first principles, not just describe them. A perspective that resonates deeply with the multi-scale, quantitative approach to cell and tissue biology that Cell Science champions.", "tags": ["morphogenesis", "development"], "doi": "", "link": "https://journals.biologists.com/dev/article/152/21/dev204894/369751/Searching-for-physical-principles-of-morphogenesis", "added": "2026-08-19", "pdf_link": "", "relevance": "Relevant to Cell Science's interest in tissue self-organization, emergent patterning, and the physical principles shaping biological structures."}, {"title": "Single-cell morphodynamical trajectories enable prediction of gene expression accompanying cell state change", "authors": "", "year": "2026", "journal": "Cell Systems", "type": "research", "summary": "Copperman et al. introduce MMIST, a computational framework that links how cells move and change shape over time — their morphodynamics — to the gene expression programs driving those changes. By filming human epithelial cells (MCF10A) for 48 hours and pairing those observations with RNA sequencing, MMIST predicts gene expression at near-continuous time resolution, with direct validation from live signaling reporters. Cell Science tools were used in the methodology, and the MCF10A focus and morphology-to-function paradigm sit at the heart of Cell Science's scientific mission.", "tags": ["morphology", "cell state", "AI / ML", "single-cell"], "doi": "", "link": "https://www.cell.com/cell-systems/fulltext/S2405-4712(26)00049-9", "added": "2026-08-19", "pdf_link": "", "relevance": "Relevant to Cell Science's multimodal view of cell state, where single-cell molecular data is integrated with structural and morphological measurements. Relevant to Cell Science's holistic cell state program, which integrates molecular, structural, and morphological data to define cell identity."}, {"title": "Spatial architecture of development and disease", "authors": "Multiple authors", "year": "2025", "journal": "Nature Reviews Genetics", "type": "review", "summary": "A comprehensive review of how spatial transcriptomics is revealing the organizational principles of tissues in development and disease, covering how cell states, spatial context, and multicellular neighborhoods interact to define tissue architecture. Synthesizes recent advances in imaging-based and sequencing-based spatial approaches and their application to embryogenesis, tumorigenesis, and immune responses. Directly relevant to Cell Science's interest in spatial biology and how cell identity is organized within tissue context.", "tags": ["spatial biology", "cell state", "single-cell", "development", "morphogenesis"], "doi": "10.1038/s41576-025-00892-5", "link": "https://www.nature.com/articles/s41576-025-00892-5", "added": "2026-08-19", "pdf_link": "", "relevance": "Relevant to Cell Science's foundational interest in how cells and tissues build organisms through coordinated developmental programs."}, {"title": "Strategies and applications of synthetic cell communication", "authors": "Moghimianavval, Newell, Parvizian, Booth & Liu", "year": "2025", "journal": "Nature Chemical Biology", "type": "review", "summary": "Reviews how engineered synthetic cells communicate with each other and with living cells, classifying approaches by whether they work like autocrine, paracrine, or juxtacrine natural signaling mechanisms. Highlights recent advances in molecular tools for intercellular communication and discusses potential applications of engineering synthetic cellular communities for biosensing, cellular reprogramming, and sustainability. Sits at the intersection of synthetic biology and multicellularity, grounded in cell biology concepts rather than engineering jargon.", "tags": ["synthetic biology", "multicellular", "cell fate", "self-organization"], "doi": "10.1038/s41589-025-02002-2", "link": "https://www.nature.com/articles/s41589-025-02002-2", "added": "2026-08-19", "pdf_link": "", "relevance": "Aligned with the CellScapes program and Cell Science's engagement with synthetic developmental biology — engineering gene circuits to program cell community behavior."}, {"title": "Synthetic circuits for cell ratio control", "authors": "George Church", "year": "2026", "journal": "Nature", "type": "research", "summary": "George Church and colleagues engineer synthetic genetic circuits that, when activated in dividing cells, lock daughter cells into one of two identities at user-specified ratios — controllable anywhere from 0.1% to 99.9% and demonstrated in bacteria, yeast, and human cells. By assembling circuits in series and parallel, they create populations with multiple defined cell types from a single founding cell, with applications in fermentation optimization and self-organizing tissue architectures. Relevant to Cell Science as a powerful new tool for programming cell identity and population composition.", "tags": ["synthetic biology", "multicellular", "gene circuits"], "doi": "", "link": "https://www.nature.com/articles/s41586-026-10259-3", "added": "2026-08-19", "pdf_link": "", "relevance": "Aligned with CellScapes' use of engineered gene circuits to program synthetic cell communities toward controlled tissue-level behaviors."}, {"title": "Synthetic Developmental Biology: Understanding Through Reconstitution", "authors": "Schlissel & Li", "year": "2020", "journal": "Annual Review of Cell and Developmental Biology", "type": "review", "summary": "Reviews the emerging field of synthetic developmental biology through the lens of reconstitution — the strategy of recapitulating developmental events outside their natural context with a reduced set of components. Covers how genetic circuits, physical cues, and bioengineering tools are being used to identify the minimal components sufficient for patterning, morphogenesis, and cell fate decisions. A foundational piece for understanding the 'build to understand' philosophy that underpins modern synthetic developmental biology.", "tags": ["synthetic biology", "development", "morphogenesis", "gene circuits"], "doi": "10.1146/annurev-cellbio-020620-090650", "link": "https://www.annualreviews.org/content/journals/10.1146/annurev-cellbio-020620-090650", "added": "2026-08-19", "pdf_link": "https://www.annualreviews.org/doi/pdf/10.1146/annurev-cellbio-020620-090650", "relevance": "Aligned with the CellScapes program and Cell Science's engagement with synthetic developmental biology — engineering gene circuits to program cell community behavior. Relevant to Cell Science's foundational interest in how cells and tissues build organisms through coordinated developmental programs."}, {"title": "Synthetic morphology with agential materials", "authors": "Davies & Levin", "year": "2023", "journal": "Nature Reviews Bioengineering", "type": "review", "summary": "Co-authored by Michael Levin, this review argues that the future of synthetic morphogenesis lies not in bottom-up engineering of parts but in leveraging the goal-seeking, agential behaviors of cells themselves to build structures that couldn't be designed top-down. Covers organoids, xenobots, and bioelectric interfaces as platforms for cracking the morphogenetic code, connecting 'cognition all the way down' ideas to concrete synthetic biology applications. A conceptual framework for how agential cell behaviors can be harnessed for programmable tissue construction.", "tags": ["synthetic morphogenesis", "self-organization", "development", "bioelectricity"], "doi": "10.1038/s44222-022-00001-9", "link": "https://www.nature.com/articles/s44222-022-00001-9", "added": "2026-08-19", "pdf_link": "https://www.nature.com/articles/s44222-022-00001-9.pdf", "relevance": "Relevant to Cell Science's interest in tissue self-organization, emergent patterning, and the physical principles shaping biological structures. Aligned with the CellScapes program and Cell Science's engagement with synthetic developmental biology — engineering gene circuits to program cell community behavior."}, {"title": "The Polymers of Life: Exploring Cellular Function Through Polymer Concepts", "authors": "", "year": "2026", "journal": "Advanced Science", "type": "review", "summary": "Chen and Chilkoti review how ideas from polymer physics — the science of long-chain molecules — offer powerful new tools for understanding how cells organize their interiors, with a focus on biomolecular condensates. These membrane-free droplets form via phase separation and play key roles in gene regulation and cell state. The polymer physics lens explains why condensates behave as they do and connects to broader questions of intracellular organization that sit at the heart of Cell Science's scientific program.", "tags": ["phase separation", "cell state", "development"], "doi": "", "link": "https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.75240", "added": "2026-08-19", "pdf_link": "https://doi.org/10.1002/advs.75240", "relevance": "Relevant to understanding how biomolecular condensates and polymer organization contribute to intracellular structure — a core Cell Science research interest. Relevant to Cell Science's foundational interest in how cells and tissues build organisms through coordinated developmental programs."}, {"title": "Tissue fluidity mediates a trade-off between the speed and accuracy of multicellular patterning by cell sorting", "authors": "Garner, McGeary, Klein & Megason", "year": "2025", "journal": "Biophysical Journal", "type": "research", "summary": "Shows that tissue fluidity creates a fundamental trade-off: too little and cells can't sort by type at all; too much and they sort quickly but inaccurately. An intermediate, regulated level of fluidity is optimal. Striking finding that cells may co-regulate motility and adhesion to maintain themselves in this Goldilocks zone. Adds physical dimension to questions of spatial cell identity and tissue organization central to Cell Science.", "tags": ["tissue mechanics", "self-organization", "morphogenesis", "cell fate", "development"], "doi": "", "link": "https://www.sciencedirect.com/science/article/pii/S0006349525006526", "added": "2026-08-19", "pdf_link": "", "relevance": "Relevant to Cell Science's interest in tissue mechanics and phase-like transitions that govern how tissues flow or stiffen during morphogenesis. Relevant to CellScapes and Cell Science's broader interest in how cells cooperate and self-organize to form tissues with emergent properties."}, {"title": "Tissue rigidity phase transition shapes morphogen gradients", "authors": "Nicoletta Petridou", "year": "2025", "journal": "Nature Cell Biology", "type": "research", "summary": "Petridou and colleagues show that tissue patterning during development isn't just driven by chemical gradients — the physical state of the tissue (how fluid or solid it is) feeds back onto those gradients in a closed loop. Phase transitions in tissue mechanics and morphogen signaling co-regulate each other, making patterning more robust and dynamic than either process alone could achieve. Directly relevant to Cell Science's interest in how physical and molecular properties of cells jointly determine tissue organization.", "tags": ["morphogenesis", "cell fate", "development", "tissue mechanics"], "doi": "10.1038/s41556-026-01954-4", "link": "https://www.nature.com/articles/s41556-026-01954-4", "added": "2026-08-19", "pdf_link": "https://doi.org/10.1038/s41556-026-01954-4", "relevance": "Relevant to Cell Science's interest in tissue mechanics and phase-like transitions that govern how tissues flow or stiffen during morphogenesis."}, {"title": "Towards multimodal foundation models in molecular cell biology", "authors": "Cui, Tejada-Lapuerta, Brbić, Theis et al.", "year": "2025", "journal": "Nature", "type": "perspective", "summary": "Envisions building multimodal foundation models pretrained on diverse omics datasets — genomics, transcriptomics, epigenomics, proteomics, metabolomics, and spatial profiling — to create holistic maps of cells, genes, and tissues. More technically grounded than companion pieces, but directly relevant to Cell Science's computational infrastructure questions around multimodal data integration.", "tags": ["AI / ML", "cell state", "single-cell", "spatial biology", "multimodal"], "doi": "10.1038/s41586-025-08710-y", "link": "https://www.nature.com/articles/s41586-025-08710-y", "added": "2026-08-19", "pdf_link": "https://dash.harvard.edu/bitstreams/60dc22c5-5b11-4eab-a6d5-6da5bdc5d887/download", "relevance": "Relevant to Cell Science's AI and computational agenda for modeling cell biology and building virtual cell frameworks."}, {"title": "Turing's next steps: the mechanochemical basis of morphogenesis", "authors": "", "year": "2011", "journal": "Nature Reviews Molecular Cell Biology", "type": "perspective", "summary": "Howard, Grill, and Bois extend Turing's classic reaction-diffusion patterning framework to incorporate mechanical forces, arguing that motor proteins and physical stresses are effectively morphogens too. The perspective reframes morphogenesis as a mechanochemical problem where chemistry and physics are inseparable — a view that has proven deeply influential in the field. A foundational paper for anyone thinking about patterning, self-organization, or the physical basis of developmental biology.", "tags": ["morphogenesis", "Turing patterning", "mechanobiology"], "doi": "", "link": "https://www.nature.com/articles/nrm3120", "added": "2026-08-19", "pdf_link": "", "relevance": "Relevant to Cell Science's interest in tissue self-organization, emergent patterning, and the physical principles shaping biological structures."}, {"title": "Virtual cells need context, not just scale", "authors": "Multiple authors", "year": "2026", "journal": "bioRxiv", "type": "perspective", "summary": "A position paper arguing that the primary bottleneck for virtual cell models isn't model size or architecture — it's inadequate coverage of diverse biological contexts in training data. Challenges the field's prevailing assumption that scaling up will solve the virtual cell problem, calling instead for richer, more contextually diverse datasets. A timely and pointed perspective for Cell Science, which is actively contributing both the imaging data and the biological context that virtual cell models need.", "tags": ["AI / ML", "virtual cell", "cell state", "single-cell"], "doi": "", "link": "https://www.biorxiv.org/content/10.64898/2026.02.04.703804v1.full", "added": "2026-08-19", "pdf_link": "https://www.biorxiv.org/content/10.64898/2026.02.04.703804v1.full.pdf", "relevance": "Supports Cell Science's virtual cell and generative modeling agenda for integrating multi-modal cell biology data into predictive computational models."}, {"title": "Visions of the future of molecular cell biology", "authors": "", "year": "2025", "journal": "Nature Reviews Molecular Cell Biology", "type": "perspective", "summary": "To mark its 25th anniversary, Nature Reviews Molecular Cell Biology asked 13 leading researchers to imagine the field in 2050. Contributors span mechanobiology, AI-powered virtual cells, organelle biology, RNA biology, imaging, and more. The result is a curated panorama of where the field's most forward-thinking scientists believe it is heading — covering both technological and conceptual revolutions. An essential read for any cell biology director thinking about the field's trajectory.", "tags": ["cell state", "development"], "doi": "", "link": "https://www.nature.com/articles/s41580-025-00892-7", "added": "2026-08-19", "pdf_link": "", "relevance": "Relevant to Cell Science's foundational interest in how cells and tissues build organisms through coordinated developmental programs."}, {"title": "What do you most hope we will achieve with mammalian synthetic biology within the next decade?", "authors": "Leonardo Morsut, Lacra Bintu", "year": "2026", "journal": "Cell Systems", "type": "perspective", "summary": "A multi-author perspectives piece in Cell Systems where field leaders — including Morsut and Bintu — each answer the same question: what would constitute real progress in mammalian synthetic biology over the next decade? Answers range from building tissues with programmable architecture to engineering immune responses to understanding the logic of cell fate from first principles. A collective vision piece that maps where the synthetic biology community's ambitions and hopes are focused.", "tags": ["synthetic biology", "multicellular"], "doi": "", "link": "https://www.cell.com/cell-systems/fulltext/S2405-4712(25)00318-7", "added": "2026-08-19", "pdf_link": "", "relevance": "Aligned with the CellScapes program and Cell Science's engagement with synthetic developmental biology — engineering gene circuits to program cell community behavior."}, {"title": "Why the temporal dimension matters in cellular signalling", "authors": "Yang & Jin", "year": "2026", "journal": "Nature Cell Biology", "type": "perspective", "summary": "Argues that cells encode information not just in what signals they receive but when — temporal encoding offers a fundamental information-theoretic advantage over amplitude-based signaling alone, providing a predictive framework linking temporal codes to differential gene regulation. Directly cites Elowitz lab work and connects to how cells make fate decisions. Sits at the intersection of signaling dynamics and cell state, with broad implications for understanding how developmental decisions are made and how they might be engineered.", "tags": ["cell state", "cell fate", "development"], "doi": "10.1038/s41556-026-02006-7", "link": "https://www.nature.com/articles/s41556-026-02006-7", "added": "2026-08-19", "pdf_link": "", "relevance": "Relevant to Cell Science's holistic cell state program, which integrates molecular, structural, and morphological data to define cell identity."}, {"title": "Mechanotransduction and cell fate: from molecular sensors to multicellular self-organization", "authors": "María del Carmen Estrada Elorza, Mónica Cruz-Lemini, Karina Martínez-Mayorga, Mariana G. Martinez-Garfias, Ana Carolina Gómez-Carrillo, A. Ríos-Pérez et al.", "year": "2026", "journal": "Frontiers in Cell and Developmental Biology", "type": "review", "summary": "Reviews how cells convert mechanical signals — from substrate stiffness, geometry, and neighboring cells — into changes in gene expression and ultimately cell fate decisions. Bridges molecular-level mechanosensing (integrins, YAP/TAZ, cytoskeletal tension) to emergent tissue-level behaviors, including how collective mechanical states pattern developing tissues. A useful synthesis of how physical forces and biochemical identity are coupled across scales in both development and homeostasis.", "tags": ["development", "morphogenesis", "cell fate", "self-organization", "mechanobiology", "multicellular"], "doi": "10.3389/fcell.2026.1871354", "link": "https://www.semanticscholar.org/paper/32fe6b588cf0457a27bf8ee60d1b8b8d9a232218", "score": 10, "added": "2026-08-19", "pdf_link": "https://www.frontiersin.org/journals/cell-and-developmental-biology/articles/10.3389/fcell.2026.1871354/pdf", "relevance": "Relevant to Cell Science's interest in how cells make identity decisions, with implications for stem cell differentiation and iPSC-based model systems. Relevant to Cell Science's interest in emergent tissue organization and how multicellular systems self-pattern without external instruction."}, {"title": "Spatial Control of Light-Responsive Proteins and Optogenetics Within Hydrogels via Volumetric Bioprinting.", "authors": "Davide Ribezzi, Pere Català, Gabriel Größbacher, Paulina Nuñez Bernal, Olaf Nijssen, Sammy Florczak et al.", "year": "2026", "journal": "Advanced materials (Deerfield Beach, Fla.)", "type": "research", "summary": "Describes a volumetric bioprinting approach for embedding light-responsive proteins and optogenetic constructs in user-defined 3D geometries within hydrogels. By controlling the spatial distribution of photosensitive machinery at the millimeter scale, the method enables spatially patterned activation of cellular responses — including gene expression and signaling — in engineered tissue constructs. Bridges synthetic biology, bioengineering, and optogenetics in a platform relevant to next-generation organoid and tissue-on-a-chip design.", "tags": ["cell fate", "synthetic biology"], "doi": "10.1002/adma.74563", "link": "https://doi.org/10.1002/adma.74563", "score": 8, "added": "2026-08-19", "pdf_link": "https://doi.org/10.1002/adma.74563", "relevance": "Aligned with CellScapes' use of engineered gene circuits to program synthetic cell communities toward controlled tissue-level behaviors."}, {"title": "Bioelectrical regionalization of multicellular aggregates by microRNAs.", "authors": "Josu Egea-Carro, S. Mafe, Michael Levin, J. Cervera", "year": "2026", "journal": "Journal of Chemical Physics", "type": "research", "summary": "Shows that microRNAs can generate and maintain distinct bioelectrical domains within multicellular aggregates by differentially regulating ion channel expression across cell populations. This creates spatially heterogeneous membrane voltage patterns — a form of bioelectric patterning mediated by post-transcriptional gene regulation rather than gap junctions or direct ionic coupling. Connects the miRNA regulatory layer to bioelectricity, expanding the known molecular toolkit for non-neural electric signaling in development.", "tags": ["development", "single-cell", "multicellular", "bioelectricity"], "doi": "10.1063/5.0345058", "link": "https://www.semanticscholar.org/paper/df3b59fbf9dcb700e60e973f26663b973f77856e", "score": 7, "added": "2026-08-19", "pdf_link": "", "relevance": "Touches on bioelectric signaling mechanisms relevant to Cell Science's broader interest in non-canonical developmental signals in morphogenesis. Relevant to CellScapes and Cell Science's broader interest in how cells cooperate and self-organize to form tissues with emergent properties."}, {"title": "Identifying phenotype-genotype-function coupling in 3D organoid imaging using Shape, Appearance and Motion Phenotype Observation Tool (SPOT)", "authors": "Felix Y. Zhou, Brittany Jacobs, Adam Norton-Steele, Xiaoyue Han, Linna Zhou, Thomas Carroll, Carlos Ruiz Puig, Joseph Chadwick et al.", "year": "2026", "journal": "Nature Communications", "type": "research", "summary": "SAM-SPOT introduces a standardized framework for quantifying 3D morpho-dynamic phenotypes in live organoid imaging — essentially an image-level analogue of the transcriptome — without requiring prior biological knowledge. Applied to over 1.6 million mouse and human organoid instances, it links live imaging readouts to genetic and chemical perturbations and, combined with scRNA-seq, shows that WNT (but not RAS or p53) drives irregular morphogenesis in intestinal organoids. Directly relevant to Cell Science's core mission of connecting cell shape and dynamics to molecular identity, and a high-value methodological advance for organoid-based phenotyping at scale.", "tags": ["organoid", "morphology", "AI / ML", "single-cell", "signaling dynamics", "cell state", "multimodal"], "doi": "10.1038/s41467-026-75506-7", "link": "https://www.nature.com/articles/s41467-026-75506-7", "score": 10, "added": "2026-08-20", "pdf_link": "https://doi.org/10.1038/s41467-026-75506-7", "relevance": "Relevant to Cell Science's interest in organoid systems, lumen formation mechanics, and live imaging of three-dimensional culture morphodynamics."}, {"title": "Machine learning approaches for biomechanical and bioelectrical regulation in developmental tissue engineering", "authors": "Miriam Filippi, Robert K. Katzschmann", "year": "2026", "journal": "Bio-Design and Manufacturing", "type": "review", "summary": "Reviews how machine learning is being applied to decode the physical and electrical signals that govern tissue development, covering biomechanical force inference, bioelectric pattern recognition, and the integration of multi-modal imaging data to predict developmental outcomes.", "tags": ["development", "morphogenesis", "cell fate", "self-organization"], "doi": "10.1631/bdm.2500560", "link": "https://www.semanticscholar.org/paper/09d07ecff3610a09f647f0d906cab3bac1f13bd9", "score": 10, "added": "2026-08-20", "pdf_link": "https://link.springer.com/content/pdf/10.1631/bdm.2500560.pdf", "relevance": "Touches on bioelectric signaling mechanisms relevant to Cell Science's broader interest in non-canonical developmental signals in morphogenesis. Relevant to Cell Science's AI agenda for cell segmentation, morphology modeling, and predicting cell state from multi-modal imaging data."}, {"title": "Shield-4i: A Whole-mount Multiplexed Imaging Platform for Studying Multiscale Information Flow in 3D Multicellular Systems", "authors": "Ruth Hornbachner, Shayan Shamipour, Feyza Nur Arslan, Rui Fan, Max Hess, Florian Curvaia et al.", "year": "2026", "journal": "bioRxiv", "type": "research", "summary": "Introduces Shield-4i, a tissue-clearing and multiplexed immunofluorescence platform that enables whole-mount imaging of intact organs across cellular and subcellular scales. The approach allows simultaneous quantification of dozens of protein markers in 3D, opening new routes to understanding how cell identity and tissue architecture are spatially coordinated.", "tags": ["development", "self-organization", "multicellular"], "doi": "10.64898/2026.07.01.735871", "link": "https://www.semanticscholar.org/paper/f9295adb463b542d03d6150b157d0b04206ec80f", "score": 10, "added": "2026-08-20", "pdf_link": "https://doi.org/10.64898/2026.07.01.735871", "relevance": "Relevant to CellScapes and Cell Science's broader interest in how cells cooperate and self-organize to form tissues with emergent properties."}, {"title": "Biophysical forces in tissue formation.", "authors": "Lei Xia, Anish Ashok Adpaikar, Liling Wen, Y. Rinkevich", "year": "2026", "journal": "Seminars in Cell and Developmental Biology", "type": "review", "summary": "Reviews the role of mechanical forces — including tension, compression, and fluid pressure — in driving tissue morphogenesis. Covers how cells sense and respond to physical cues, how force transmission coordinates multicellular behavior, and the interplay between gene expression and mechanical signaling during development.", "tags": ["development", "morphogenesis", "cell fate", "self-organization", "organoid", "collective migration"], "doi": "10.1016/j.semcdb.2026.103684", "link": "https://www.semanticscholar.org/paper/f14d9603ebc9682cf6435aa7bd652ed51997f72b", "score": 10, "added": "2026-08-20", "relevance": "Relevant to Cell Science's interest in tissue self-organization, emergent patterning, and the physical principles shaping biological structures. Supports Cell Science's interest in tissue mechanics and how physical forces govern cell behavior, tissue organization, and morphogenesis."}, {"title": "Real-time sensing-integrated organoid-on-a-chip platforms: Technological progress and emerging biomedical applications", "authors": "Chenwei Sun, Guohua Wu, Di Wu, Qijun Du, Q. Lu, Wenqi Hu et al.", "year": "2026", "journal": "Bioactive Materials", "type": "review", "summary": "Surveys organ-on-a-chip systems that combine live organoid culture with embedded biosensors for real-time monitoring of metabolic, electrophysiological, and mechanical parameters. Discusses how continuous readouts from these platforms can ac
