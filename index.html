celerate disease modeling, drug screening, and our understanding of tissue homeostasis.", "tags": ["stem cells", "development", "organoid", "disease modeling"], "doi": "10.1016/j.bioactmat.2026.06.041", "link": "https://www.semanticscholar.org/paper/a7254cc7bee45c1bfbfa0856ffee13e8d51d3f59", "score": 8, "added": "2026-08-20", "pdf_link": "https://doi.org/10.1016/j.bioactmat.2026.06.041", "relevance": "Relevant to Cell Science's interest in organoid systems, lumen formation mechanics, and live imaging of three-dimensional culture morphodynamics."}, {"title": "Cardiac EndMT and EpiMT as a developmental continuum: integration of mechanical, metabolic, and epigenetic regulation", "authors": "Diwen Li, Shijun Hu, Tianli Zhao", "year": "2026", "journal": "Frontiers in Cell and Developmental Biology", "type": "review", "summary": "Endothelial-to-mesenchymal transition (EndMT) and epithelial-to-mesenchymal transition (EpiMT) are fundamental cell-state changes that shape the heart during development. This work reframes them as a unified developmental continuum, integrating the mechanical, signaling, and molecular programs that drive these transitions in cardiac tissue. Understanding these processes as a continuum rather than discrete events has implications for stem cell-based cardiac models and disease research.", "tags": ["development", "cell fate", "cell state", "single-cell", "organoid", "live imaging"], "doi": "10.3389/fcell.2026.1892888", "link": "https://www.semanticscholar.org/paper/b2bd374167d4bfa141d951cc13891d4d679d7768", "score": 10, "added": "2026-08-21", "pdf_link": "https://doi.org/10.3389/fcell.2026.1892888", "relevance": "Relevant to Cell Science's foundational interest in how cells and tissues build organisms through coordinated developmental programs."}, {"title": "Engineering Pluripotent Stem Cells-Derived Inner Ear Organoids With Enhanced Maturation and Reproducibility by Micro-Topographical Cues.", "authors": "H. Sharma, Jungeun Lim, W. Kim, Y. Kim, Dream Kim, Shinyull Lee et al.", "year": "2026", "journal": "Advances in Materials", "type": "research", "summary": "Inner ear organoids derived from pluripotent stem cells offer a powerful platform for studying auditory development and hearing disorders, but recapitulating functional maturation of cochlear hair cells and supporting structures remains a major challenge. This study introduces enhanced engineering strategies — likely through biomaterial scaffolds or small-molecule protocols — to improve structural and functional maturation of PSC-derived inner ear organoids. Better-matured organoids expand the utility of stem cell models for mechanistic studies and translational applications in hearing biology.", "tags": ["stem cells", "development", "morphogenesis", "organoid", "disease modeling"], "doi": "10.1002/adma.74560", "link": "https://www.semanticscholar.org/paper/e00e7b28f70f5208563baf404cae873a3c07074c", "score": 8, "added": "2026-08-21", "pdf_link": "https://doi.org/10.1002/adma.74560", "relevance": "Relevant to Cell Science's interest in organoid systems, lumen formation mechanics, and live imaging of three-dimensional culture morphodynamics. Relevant to Cell Science's core work on hiPSC biology, pluripotent stem cell engineering, and stem cell-derived model systems."}, {"title": "Mechanics of compression-driven morphogenesis.", "authors": "Jue Yu Kelly Tan, Chii Jou Chan", "year": "2026", "journal": "Development (Cambridge, England)", "type": "research", "summary": "Tissue morphogenesis is shaped not only by growth and molecular patterning but by mechanical forces — including compression — that sculpt three-dimensional form during development. This work examines how compressive forces drive specific morphogenetic events, analyzing the physical principles and cellular responses that convert mechanical compression into coordinated tissue deformation. The findings contribute to a biomechanical framework for development that complements molecular approaches and informs the design of engineered tissues.", "tags": ["development", "morphogenesis", "organoid"], "doi": "10.1242/dev.205781", "link": "https://doi.org/10.1242/dev.205781", "score": 8, "added": "2026-08-21", "relevance": "Relevant to Cell Science's interest in tissue self-organization, emergent patterning, and the physical principles shaping biological structures."}, {"title": "Mechanical constraints on cell plasticity: insights from the olfactory epithelium", "authors": "Raphaël Aguillon, P. Dufourcq, Julie Batut", "year": "2026", "journal": "Frontiers in Cell and Developmental Biology", "type": "review", "summary": "Cell plasticity — the capacity to change state, identity, or behavior — is regulated not only by molecular signals but by the mechanical context of the tissue microenvironment. Using the olfactory epithelium as a model system, this study shows how mechanical constraints shape the range of accessible cell states and influence plasticity outcomes. The findings have broad implications for understanding how tissue mechanics governs regeneration, stem cell fate, and the physical limits of cellular reprogramming.", "tags": ["development", "mechanobiology", "single-cell"], "doi": "10.3389/fcell.2026.1841670", "link": "https://www.semanticscholar.org/paper/3f44c0363b0f7f2a48ca6c9b818fdfbe31627f41", "score": 7, "added": "2026-08-21", "pdf_link": "https://doi.org/10.3389/fcell.2026.1841670", "relevance": "Supports Cell Science's interest in tissue mechanics and how physical forces govern cell behavior, tissue organization, and morphogenesis."}, {"title": "Human iPSC-derived 3D cardiac models for cardiomyopathies: organoids, spheroids, and engineered heart tissues as translational platforms", "authors": "Prabin Upadhyaya", "year": "2026", "journal": "Stem Cells", "type": "review", "summary": "Human iPSC-derived three-dimensional cardiac models — including organoids, spheroids, and engineered heart tissues — have emerged as powerful platforms for studying cardiomyopathies with patient-specific genetic backgrounds. This review systematically compares these model types across dimensions of structural maturity, functional readout, scalability, and disease relevance. The analysis highlights how advances in 3D cardiac modeling are bringing stem cell biology closer to the structural complexity and functional maturity needed for mechanistic disease studies and drug screening.", "tags": ["development", "organoid", "iPSC"], "doi": "10.1093/stmcls/sxag039", "link": "https://www.semanticscholar.org/paper/7ad12009fd8110049134451ce70983e486696400", "score": 7, "added": "2026-08-21", "pdf_link": "https://doi.org/10.1093/stmcls/sxag039", "relevance": "Relevant to Cell Science's interest in organoid systems, lumen formation mechanics, and live imaging of three-dimensional culture morphodynamics. Relevant to Cell Science's core work on hiPSC biology, pluripotent stem cell engineering, and stem cell-derived model systems."}];

});

/* ── Filter state ───────────────────────────────────────────────────────── */
let activeType = 'all', activeTags = new Set(), activeYear = 'all', activeAdded = 'all', searchText = '';

/* ── Type chips ─────────────────────────────────────────────────────────── */
function countByType(type) {
  return type === 'all' ? PAPERS.length : PAPERS.filter(p => (p.type||'research') === type).length;
}
const TYPES = ['all','research','review','perspective'];
const typeRow = document.getElementById('type-filters');
TYPES.forEach(t => {
  const chip = document.createElement('button');
  chip.className = 'chip' + (t === 'all' ? ' active' : '');
  chip.dataset.type = t;
  const label = t === 'all' ? 'All' : t.charAt(0).toUpperCase() + t.slice(1);
  chip.innerHTML = label + '<span class="count">' + countByType(t) + '</span>';
  chip.addEventListener('click', () => {
    activeType = t;
    document.querySelectorAll('#type-filters .chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active'); render();
  });
  typeRow.appendChild(chip);
});

/* ── Topic tag chips ────────────────────────────────────────────────────── */
const TAG_BLOCKLIST = new Set(['perspective','perspectives','review','research','preprint','editorial','comment','letter']);
function isTopicTag(t) { return !TAG_BLOCKLIST.has(t.toLowerCase()); }
const tagCounts = {};
PAPERS.forEach(p => (p.tags||[]).filter(isTopicTag).forEach(tag => { tagCounts[tag] = (tagCounts[tag]||0)+1; }));
const allTags = Object.entries(tagCounts).sort((a,b)=>b[1]-a[1]).map(([t])=>t);
const tagRow = document.getElementById('tag-filters');
allTags.forEach(tag => {
  const chip = document.createElement('button');
  chip.className = 'chip'; chip.dataset.tag = tag;
  chip.innerHTML = tag + '<span class="count">' + tagCounts[tag] + '</span>';
  chip.addEventListener('click', () => {
    if (activeTags.has(tag)) { activeTags.delete(tag); chip.classList.remove('active'); }
    else { activeTags.add(tag); chip.classList.add('active'); }
    render();
  });
  tagRow.appendChild(chip);
});

/* ── Publication year chips ─────────────────────────────────────────────── */
const yearCounts = {};
PAPERS.forEach(p => { const y = String(p.year||'').trim(); if (y) yearCounts[y] = (yearCounts[y]||0)+1; });
const allYears = Object.keys(yearCounts).sort((a,b)=>b-a);
const yearRow = document.getElementById('year-filters');
{
  const chip = document.createElement('button');
  chip.className = 'chip active'; chip.dataset.year = 'all';
  chip.innerHTML = 'All<span class="count">'+PAPERS.length+'</span>';
  chip.addEventListener('click', () => {
    activeYear = 'all';
    document.querySelectorAll('#year-filters .chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active'); render();
  });
  yearRow.appendChild(chip);
}
allYears.forEach(y => {
  const chip = document.createElement('button');
  chip.className = 'chip'; chip.dataset.year = y;
  chip.innerHTML = y + '<span class="count">'+yearCounts[y]+'</span>';
  chip.addEventListener('click', () => {
    activeYear = y;
    document.querySelectorAll('#year-filters .chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active'); render();
  });
  yearRow.appendChild(chip);
});

/* ── Date-added chips ───────────────────────────────────────────────────── */
const today = new Date();
function daysAgo(n) {
  const d = new Date(today); d.setDate(d.getDate()-n); return d.toISOString().slice(0,10);
}
const ADDED_RANGES = [
  { label: 'All', key: 'all' },
  { label: 'Last 30 days', key: '30' },
  { label: 'Last 3 months', key: '90' },
  { label: 'Last 6 months', key: '180' },
  { label: 'This year', key: 'year' },
];
function addedCount(key) {
  if (key === 'all') return PAPERS.length;
  const cutoff = key === 'year' ? String(today.getFullYear())+'-01-01' : daysAgo(parseInt(key));
  return PAPERS.filter(p => (p.added||'') >= cutoff).length;
}
const addedRow = document.getElementById('added-filters');
ADDED_RANGES.forEach(({label, key}) => {
  const chip = document.createElement('button');
  chip.className = 'chip' + (key === 'all' ? ' active' : ''); chip.dataset.added = key;
  chip.innerHTML = label + '<span class="count">'+addedCount(key)+'</span>';
  chip.addEventListener('click', () => {
    activeAdded = key;
    document.querySelectorAll('#added-filters .chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active'); render();
  });
  addedRow.appendChild(chip);
});

/* ── Search ─────────────────────────────────────────────────────────────── */
document.getElementById('search').addEventListener('input', e => { searchText = e.target.value.toLowerCase(); render(); });

/* ── Tag clicks inside grid ─────────────────────────────────────────────── */
document.getElementById('grid').addEventListener('click', e => {
  const tag = e.target.dataset.clicktag;
  if (!tag) return;
  if (activeTags.has(tag)) activeTags.delete(tag); else activeTags.add(tag);
  document.querySelectorAll('#tag-filters .chip').forEach(c => { c.classList.toggle('active', activeTags.has(c.dataset.tag)); });
  render();
});

/* ── Notes storage (localStorage) ───────────────────────────────────────── */
function noteKey(p) { return 'note:' + (p.doi || p.title || '').slice(0, 120); }
function getNote(p) { try { return localStorage.getItem(noteKey(p)) || ''; } catch(e) { return ''; } }
function setNote(p, v) { try { localStorage.setItem(noteKey(p), v); } catch(e) {} }

/* ── Card rendering ─────────────────────────────────────────────────────── */
function authorLink(name) { return 'https://scholar.google.com/scholar?q=' + encodeURIComponent(name); }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmt(p) {
  const type = (p.type||'research').toLowerCase();
  const badgeClass = 'badge-'+(type==='review'?'review':type==='perspective'?'perspective':'research');
  const titleHtml = p.link ? '<a href="'+esc(p.link)+'" target="_blank" rel="noopener">'+esc(p.title)+'</a>' : esc(p.title);
  const rawAuthors = typeof p.authors === 'string' ? p.authors : (p.authors||[]).join(', ');
  const authorNames = rawAuthors.split(/,\s*et al\.?/).map(s=>s.trim()).join('').split(/,\s*/).map(s=>s.trim()).filter(Boolean);
  const authorHtml = authorNames.map(a => {
    const name = a.replace(/\s*et al\.?\s*$/,'').trim();
    return name ? '<a class="author-link" href="'+authorLink(name)+'" target="_blank" rel="noopener">'+esc(name)+'</a>' : '';
  }).filter(Boolean).join('<span style="color:var(--border)"> · </span>');
  const tags = (p.tags||[]).filter(isTopicTag).map(t=>'<span class="tag" data-clicktag="'+esc(t)+'">'+esc(t)+'</span>').join('');
  const added = p.added ? '<span class="card-date">added '+p.added+'</span>' : '';
  const venue = [p.journal, p.year].filter(Boolean).join(' · ');
  const pdfBtn = p.pdf_link ? '<a class="btn-pdf" href="'+esc(p.pdf_link)+'" target="_blank" rel="noopener">&#8595; PDF</a>' : '';
  const existingNote = getNote(p);
  const hasNote = existingNote.trim().length > 0;
  const noteId = 'note-' + Math.random().toString(36).slice(2);
  return '<div class="card">'
    +'<div class="card-meta"><span class="badge '+badgeClass+'">'+esc(type)+'</span>'+added+'</div>'
    +'<div class="card-title">'+titleHtml+'</div>'
    +(authorHtml ? '<div class="card-authors">'+authorHtml+'</div>' : '')
    +(venue ? '<div class="card-venue">'+esc(venue)+'</div>' : '')
    +(p.summary ? '<div class="card-summary">'+esc(p.summary)+'</div>' : '')
    +(p.relevance ? '<div class="card-relevance"><div class="card-relevance-label">Cell Science relevance</div><div class="card-relevance-text">'+esc(p.relevance)+'</div></div>' : '')
    +(tags ? '<div class="card-tags">'+tags+'</div>' : '')
    +(pdfBtn ? '<div class="card-actions">'+pdfBtn+'</div>' : '')
    +'<div class="notes-section">'
      +'<button class="notes-toggle'+(hasNote?' has-notes':'')+'" data-noteid="'+noteId+'">'
        +(hasNote ? '&#128221; Notes' : '+ Add note')
      +'</button>'
      +'<div class="notes-area" id="'+noteId+'">'
        +'<textarea class="notes-textarea" rows="3" placeholder="Your notes…">'+esc(existingNote)+'</textarea>'
        +'<div class="notes-saved"></div>'
      +'</div>'
    +'</div>'
    +'</div>';
}

/* ── Notes interaction ──────────────────────────────────────────────────── */
let _papersByNoteId = {};
function bindNotes(paper, noteId) {
  _papersByNoteId[noteId] = paper;
}
document.getElementById('grid').addEventListener('click', e => {
  const btn = e.target.closest('.notes-toggle');
  if (!btn) return;
  const id = btn.dataset.noteid;
  const area = document.getElementById(id);
  if (!area) return;
  area.classList.toggle('open');
  if (area.classList.contains('open')) {
    area.querySelector('textarea').focus();
  }
});
document.getElementById('grid').addEventListener('input', e => {
  if (!e.target.classList.contains('notes-textarea')) return;
  const area = e.target.closest('.notes-area');
  const noteId = area?.id;
  const paper = _papersByNoteId[noteId];
  if (!paper) return;
  setNote(paper, e.target.value);
  const saved = area.querySelector('.notes-saved');
  if (saved) saved.textContent = 'Saved';
  const toggle = document.querySelector('[data-noteid="'+noteId+'"]');
  if (toggle) {
    const hasNote = e.target.value.trim().length > 0;
    toggle.classList.toggle('has-notes', hasNote);
    toggle.textContent = hasNote ? '📑 Notes' : '+ Add note';
    toggle.dataset.noteid = noteId;
  }
});

/* ── Render ─────────────────────────────────────────────────────────────── */
function render() {
  const q = searchText;
  const addedCutoff = activeAdded === 'all' ? '' : activeAdded === 'year' ? String(today.getFullYear())+'-01-01' : daysAgo(parseInt(activeAdded));
  const filtered = PAPERS.filter(p => {
    if (activeType !== 'all' && (p.type||'research') !== activeType) return false;
    if (activeTags.size > 0 && ![...(p.tags||[])].some(t => activeTags.has(t))) return false;
    if (activeYear !== 'all' && String(p.year||'').trim() !== activeYear) return false;
    if (addedCutoff && (p.added||'') < addedCutoff) return false;
    if (q) { const hay = [p.title, p.authors, p.journal, p.summary,...(p.tags||[])].join(' ').toLowerCase(); if (!hay.includes(q)) return false; }
    return true;
  });
  _papersByNoteId = {};
  const grid = document.getElementById('grid');
  if (filtered.length) {
    const cards = filtered.map(p => {
      const html = fmt(p);
      // extract the noteId we just generated so we can register it
      const m = html.match(/data-noteid="(note-[^"]+)"/);
      if (m) _papersByNoteId[m[1]] = p;
      return html;
    });
    grid.innerHTML = cards.join('');
  } else {
    grid.innerHTML = '<div class="empty">No papers match your filters.</div>';
  }
  document.getElementById('result-count').textContent = filtered.length+' paper'+(filtered.length===1?'':'s');
}
render();
</script>
