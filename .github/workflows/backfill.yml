name: Backfill

on:
  workflow_dispatch:
    inputs:
      step:
        description: "Which backfill step to run"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - authors
          - summaries
          - pdfs

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Backfill, regenerate site, push
        env:
          STEP: ${{ github.event.inputs.step }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Uploads and site edits push to main at any time: redo the work on the latest main and retry
          # instead of failing on a rejected push.
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git reset --hard origin/main
            if [ "$STEP" = "all" ] || [ "$STEP" = "authors" ];   then python backfill_authors.py;   fi
            if [ "$STEP" = "all" ] || [ "$STEP" = "summaries" ]; then python backfill_summaries.py; fi
            if [ "$STEP" = "all" ] || [ "$STEP" = "pdfs" ];      then python backfill_pdfs.py;      fi
            python generate_site.py
            git add papers.json index.html filters.json papers_data.json
            if git diff --cached --quiet; then
              echo "Nothing to commit."
              exit 0
            fi
            git commit -m "chore: backfill authors, summaries, and pdf links"
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected on attempt $attempt - retrying in $((attempt * 4))s..."
            sleep $((attempt * 4))
          done
          echo "All push attempts failed."
          exit 1
