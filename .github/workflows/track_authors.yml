name: Track VIP Authors

on:
  schedule:
    # Every Monday at 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'Days back to look for new papers'
        default: '14'
        type: string
      vip_threshold:
        description: 'Min score for main feed (below → vip_only)'
        default: '6'
        type: string
      dry_run:
        description: 'Score but do not write'
        default: false
        type: boolean

jobs:
  track:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch VIP author papers, regenerate site, push
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          LOOKBACK="${{ inputs.lookback_days || '14' }}"
          THRESHOLD="${{ inputs.vip_threshold || '6' }}"
          DRY_RUN="${{ inputs.dry_run || 'false' }}"

          ARGS=(--lookback-days "$LOOKBACK" --vip-threshold "$THRESHOLD")
          [ "$DRY_RUN" = "true" ] && ARGS+=(--dry-run)

          if [ "$DRY_RUN" = "true" ]; then
            python track_authors.py "${ARGS[@]}"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Uploads and site edits push to main at any time: redo the work on the latest main and retry
          # instead of failing on a rejected push.
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git reset --hard origin/main
            python track_authors.py "${ARGS[@]}"
            python generate_site.py
            git add papers.json authors.json index.html filters.json papers_data.json
            if git diff --cached --quiet; then
              echo "No changes to commit."
              exit 0
            fi
            git commit -m "chore: add VIP author papers ($(date -u +%Y-%m-%d))"
            if git push origin main; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected on attempt $attempt - retrying in $((attempt * 4))s..."
            sleep $((attempt * 4))
          done
          echo "All push attempts failed."
          exit 1
