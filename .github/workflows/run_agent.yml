name: Literature Agent

on:
  schedule:
    - cron: "0 9 * * 1"   # Every Monday at 9am UTC
  workflow_dispatch:
    inputs:
      days:
        description: "Days back to search"
        default: "14"
        type: string
      min_score:
        description: "Minimum relevance score (0-10)"
        default: "8"
        type: string
      dry_run:
        description: "Dry run (don't write to papers.json)"
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          DAYS="${{ github.event.inputs.days || '14' }}"
          MIN_SCORE="${{ github.event.inputs.min_score || '7' }}"
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"
          EXTRA=""
          if [ "$DRY_RUN" = "true" ]; then EXTRA="--dry-run"; fi
          python agent.py --days "$DAYS" --min-score "$MIN_SCORE" $EXTRA

      - name: Backfill authors
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: python backfill_authors.py

      - name: Backfill summaries
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python backfill_summaries.py

      - name: Backfill PDF links
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: python backfill_pdfs.py

      - name: Regenerate site
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: python generate_site.py

      - name: Commit and push updates
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          # The run above is slow, so main may have moved (uploads, site edits, other bots). Don't redo it:
          # merge its new papers and filled-in fields into the latest main (merge_papers.py), then retry the push.
          cp papers.json /tmp/processed_papers.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          PUSHED=0
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            python merge_papers.py && EC=0 || EC=$?
            if [ $EC -eq 42 ]; then
              echo "Nothing new to add to origin/main."
              PUSHED=1
              break
            fi
            python generate_site.py
            git reset origin/main
            git add papers.json index.html filters.json papers_data.json
            if git diff --cached --quiet; then
              echo "No changes after merge - nothing to push."
              PUSHED=1
              break
            fi
            git commit -m "chore: weekly paper update $(date -u +%Y-%m-%d)"
            if git push; then
              echo "Pushed on attempt $attempt."
              PUSHED=1
              break
            fi
            echo "Push rejected on attempt $attempt - retrying in $((attempt * 5))s..."
            sleep $((attempt * 5))
          done
          if [ $PUSHED -eq 0 ]; then
            echo "All push attempts failed."
            exit 1
          fi
