name: Add Paper

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Paper URL (e.g. https://www.nature.com/articles/...)"
        required: false
        type: string
      doi:
        description: "DOI (e.g. 10.1038/s41467-...) — use instead of URL if you have it"
        required: false
        type: string

permissions:
  contents: write

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Add paper
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          URL="${{ github.event.inputs.url }}"
          DOI="${{ github.event.inputs.doi }}"
          ARGS=()
          if [ -n "$URL" ]; then ARGS+=(--url "$URL"); fi
          if [ -n "$DOI" ]; then ARGS+=(--doi "$DOI"); fi
          python add_paper.py "${ARGS[@]}"

      - name: Backfill authors
        run: python backfill_authors.py

      - name: Backfill summaries and relevance
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python backfill_summaries.py

      - name: Backfill PDF link
        run: python backfill_pdfs.py

      - name: Regenerate site
        run: python generate_site.py

      - name: Commit and push
        run: |
          cp papers.json /tmp/processed_papers.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          PUSHED=0
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            python3 merge_papers.py && EC=0 || EC=$?
            if [ $EC -eq 42 ]; then
              echo "Paper already in origin/main — nothing to push."
              PUSHED=1
              break
            fi
            python generate_site.py
            git reset origin/main
            git add papers.json index.html
            if git diff --cached --quiet; then
              echo "No changes after merge — nothing to push."
              PUSHED=1
              break
            fi
            git commit -m "chore: add paper via workflow"
            if git push; then
              echo "Pushed successfully on attempt $attempt."
              PUSHED=1
              break
            fi
            echo "Push rejected on attempt $attempt — retrying in $((attempt * 5))s..."
            sleep $((attempt * 5))
          done
          if [ $PUSHED -eq 0 ]; then
            echo "All push attempts failed."
            exit 1
          fi
