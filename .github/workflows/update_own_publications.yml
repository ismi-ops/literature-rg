name: Update Own Publications

# Keeps own_publications.json (Allen Institute for Cell Science papers) fresh so the agent skips them.
on:
  schedule:
    - cron: "0 7 1 * *"   # 1st of every month, 07:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (show what would change, commit nothing)"
        default: "false"
        type: choice
        options: ["false", "true"]
      prune:
        description: "Also reject matching papers already in papers.json (never Ru's picks or hand-added papers)"
        default: "true"
        type: choice
        options: ["true", "false"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Dry run
        if: github.event.inputs.dry_run == 'true'
        run: python update_own_publications.py --dry-run --prune

      - name: Update list, prune, regenerate, push
        if: github.event.inputs.dry_run != 'true'
        env:
          PRUNE: ${{ github.event.inputs.prune }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          FLAGS=""
          if [ "$PRUNE" != "false" ]; then FLAGS="--prune"; fi
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python update_own_publications.py $FLAGS
            python generate_site.py
            git add own_publications.json papers.json index.html filters.json papers_data.json
            if git diff --cached --quiet; then
              echo "Nothing changed."
              exit 0
            fi
            git commit -m "chore: update own-publications list"
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected on attempt $attempt — retrying..."
            sleep $((attempt * 4))
          done
          echo "All push attempts failed."
          exit 1
